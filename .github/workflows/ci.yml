name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5

        with:
          go-version: "1.25"

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        
        with:
          version: latest
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master

        with:
          scan-type: fs
          scan-ref: .