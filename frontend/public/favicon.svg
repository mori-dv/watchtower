<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Shield / Obsidian Hexagon -->
  <rect width="64" height="64" rx="14" fill="#08090C"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Radar concentric circles -->
  <circle cx="32" cy="32" r="22" stroke="rgba(6,182,212,0.15)" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="32" cy="32" r="14" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  
  <!-- Radar sweep wedge / cone -->
  <path d="M32 32 L50 20 A22 22 0 0 0 32 10 Z" fill="url(#sweepGrad)" opacity="0.4"/>

  <!-- Central Watchtower Sentinel Emblem -->
  <!-- Tower Body Base -->
  <path d="M26 48 L38 48 L36 32 L28 32 Z" fill="#0D1017" stroke="#10B981" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Tower Upper Pod -->
  <path d="M25 32 L39 32 L36 22 L28 22 Z" fill="#0D1017" stroke="#06B6D4" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Tower Head / Sentinel Eye -->
  <path d="M27 22 L37 22 L35 15 L29 15 Z" fill="#10B981" stroke="#34D399" stroke-width="1"/>

  <!-- Glowing Scanner Eye -->
  <circle cx="32" cy="18" r="2.5" fill="#34D399"/>
  <circle cx="32" cy="18" r="4.5" stroke="#10B981" stroke-width="0.75" opacity="0.8"/>

  <!-- Beam Pulse -->
  <line x1="32" y1="18" x2="48" y2="15" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="48" cy="15" r="1.5" fill="#22D3EE"/>

  <!-- Base Grid Points -->
  <circle cx="26" cy="48" r="1" fill="#10B981"/>
  <circle cx="38" cy="48" r="1" fill="#10B981"/>

  <defs>
    <linearGradient id="sweepGrad" x1="32" y1="32" x2="50" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
